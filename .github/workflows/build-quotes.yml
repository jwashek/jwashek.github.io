# .github/workflows/build-quotes.yml
#
# Rebuilds quotes.json from Notion and commits it to the repo.
# Runs daily at 6 AM UTC, or manually via workflow_dispatch.
#
# Required repository secrets:
#   NOTION_TOKEN       - Your Notion integration token
#   NOTION_DATABASE_ID - Your Notion database ID

name: Build Quotes

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC (2 AM ET)
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch quotes from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node build-quotes.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git diff --staged --quiet || git commit -m "chore: rebuild quotes.json from Notion [skip ci]"
          git push
