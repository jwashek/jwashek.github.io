name: Build Quotes

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build quotes from Notion
        run: node build-quotes.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SAINTS_DATABASE_ID: ${{ secrets.NOTION_SAINTS_DATABASE_ID }}
          NOTION_TEXTS_DATABASE_ID: ${{ secrets.NOTION_TEXTS_DATABASE_ID }}
          NOTION_COUNCILS_DATABASE_ID: ${{ secrets.NOTION_COUNCILS_DATABASE_ID }}

      - name: Build embeddings
        run: node build-embeddings.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add saints.json texts.json councils.json embeddings.json
          git diff --cached --quiet || (git commit -m "Update quotes and embeddings [automated]" && git push)
