<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisdom of the Saints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #8B6914;
    --gold-light: #C4963A;
    --gold-pale: #F5EDD6;
    --gold-faint: #FBF7EE;
    --ink: #1C1612;
    --ink-mid: #4A3F32;
    --ink-soft: #7A6A58;
    --border: #D4BC8A;
    --border-light: #EAD9B4;
    --bg: #FEFCF7;
    --bg-side: #F7F0E0;
    --red: #8B1A1A;
  }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--ink);
    padding: 2.5rem 2rem 2rem;
    text-align: center;
    border-bottom: 3px solid var(--gold);
    position: relative;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -7px; left: 0; right: 0;
    height: 2px;
    background: var(--gold-light);
    opacity: .4;
  }
  .header-cross {
    margin-bottom: .75rem;
    display: flex;
    justify-content: center;
  }
  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    font-weight: 400;
    color: var(--gold-pale);
    letter-spacing: .06em;
    line-height: 1.2;
  }
  .subtitle {
    font-style: italic;
    color: var(--gold-light);
    font-size: 1.05rem;
    margin-top: .5rem;
    opacity: .85;
  }

  /* ── Layout ── */
  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ── Sidebar ── */
  aside {
    width: 260px;
    flex-shrink: 0;
    background: var(--bg-side);
    border-right: 1px solid var(--border);
    padding: 1.5rem 1rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1.8rem;
  }

  .filter-group label {
    font-family: 'Cinzel', serif;
    font-size: .7rem;
    letter-spacing: .15em;
    color: var(--gold);
    text-transform: uppercase;
    display: block;
    margin-bottom: .6rem;
    padding-bottom: .3rem;
    border-bottom: 1px solid var(--border-light);
  }

  .search-wrap {
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    font-family: 'EB Garamond', serif;
    font-size: 1rem;
    padding: .5rem .75rem;
    background: white;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--ink);
    outline: none;
  }
  .search-wrap input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(139,105,20,.12);
  }
  .search-wrap input::placeholder { color: var(--ink-soft); font-style: italic; }

  .pill-list {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem;
  }
  .pill {
    font-family: 'EB Garamond', serif;
    font-size: .85rem;
    padding: .2rem .6rem;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: white;
    color: var(--ink-mid);
    cursor: pointer;
    transition: all .15s;
    line-height: 1.4;
  }
  .pill:hover { border-color: var(--gold-light); color: var(--gold); }
  .pill.active { background: var(--gold); border-color: var(--gold); color: white; }

  .clear-btn {
    font-family: 'EB Garamond', serif;
    font-size: .85rem;
    padding: .3rem .75rem;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: white;
    color: var(--ink-soft);
    cursor: pointer;
    width: 100%;
    transition: all .15s;
    margin-top: .4rem;
    font-style: italic;
  }
  .clear-btn:hover { border-color: var(--red); color: var(--red); }

  /* ── Main ── */
  main {
    flex: 1;
    padding: 1.5rem 2rem 3rem;
    overflow-y: auto;
    min-width: 0;
  }

  .results-bar {
    font-family: 'Cinzel', serif;
    font-size: .72rem;
    letter-spacing: .1em;
    color: var(--ink-soft);
    margin-bottom: 1.5rem;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: .75rem;
  }
  .results-bar span { color: var(--gold); }

  /* ── Quote Cards ── */
  .cards { display: flex; flex-direction: column; gap: 1.5rem; }

  .card {
    background: white;
    border: 1px solid var(--border-light);
    border-left: 3px solid var(--gold-light);
    border-radius: 2px;
    padding: 1.5rem 1.75rem 1.25rem;
    transition: border-left-color .2s, box-shadow .2s;
    position: relative;
  }
  .card:hover {
    border-left-color: var(--gold);
    box-shadow: 2px 0 12px rgba(139,105,20,.08);
  }

  .card-topic {
    font-family: 'Cinzel', serif;
    font-size: .68rem;
    letter-spacing: .14em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: .75rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .card-topic::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-light);
  }

  .card-quote {
    font-size: 1.13rem;
    line-height: 1.75;
    color: var(--ink);
    margin-bottom: 1rem;
    font-style: italic;
  }
  .card-quote em { font-style: normal; }

  .card-footer {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .card-attribution {
    font-size: .95rem;
    color: var(--ink-mid);
    font-style: normal;
    font-weight: 500;
  }
  .card-attribution .saint-name {
    color: var(--red);
    font-style: normal;
  }
  .card-ref {
    font-size: .83rem;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: .2rem;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: .3rem;
    justify-content: flex-end;
    max-width: 45%;
  }
  .card-tag {
    font-size: .75rem;
    padding: .15rem .5rem;
    background: var(--gold-faint);
    border: 1px solid var(--border-light);
    border-radius: 2px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .15s;
    font-style: normal;
  }
  .card-tag:hover { background: var(--gold-pale); color: var(--gold); border-color: var(--border); }
  .card-tag.hl { background: var(--gold-pale); color: var(--gold); border-color: var(--border); }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--ink-soft);
  }
  .empty .cross { font-size: 2rem; color: var(--border); margin-bottom: 1rem; }
  .empty p { font-size: 1.1rem; font-style: italic; }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .layout { flex-direction: column; }
    aside { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    main { padding: 1rem; }
    .card-tags { max-width: 100%; justify-content: flex-start; }
  }
</style>
</head>
<body>

<header>
  <div class="header-cross">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80" width="42" height="56" aria-label="Orthodox Cross">
      <g fill="none" stroke="#C4963A" stroke-linecap="round" stroke-linejoin="round">
        <!-- vertical shaft -->
        <line x1="30" y1="6" x2="30" y2="74" stroke-width="4"/>
        <!-- top small bar -->
        <line x1="18" y1="16" x2="42" y2="16" stroke-width="3.5"/>
        <!-- main crossbar -->
        <line x1="8" y1="30" x2="52" y2="30" stroke-width="4"/>
        <!-- diagonal footrest: left high, right low -->
        <line x1="14" y1="58" x2="46" y2="68" stroke-width="3.5"/>
      </g>
    </svg>
  </div>
  <h1>Wisdom of the Saints</h1>
  <p class="subtitle">Sayings of the Holy Saints of the Eastern Orthodox Church</p>
</header>

<div class="layout">
  <aside>
    <div class="filter-group">
      <label>Search</label>
      <div class="search-wrap">
        <input type="text" id="search" placeholder="Search quotes…" autocomplete="off">
      </div>
    </div>

    <div class="filter-group">
      <label>Topic</label>
      <div class="pill-list" id="topic-pills"></div>
    </div>

    <div class="filter-group">
      <label>Saint</label>
      <div class="pill-list" id="saint-pills"></div>
    </div>

    <div class="filter-group">
      <label>Tags</label>
      <div class="pill-list" id="tag-pills"></div>
    </div>

    <button class="clear-btn" id="clear-btn">Clear all filters</button>
  </aside>

  <main>
    <div class="results-bar">
      Showing <span id="count">0</span> quotes
    </div>
    <div class="cards" id="cards"></div>
  </main>
</div>

<script>
const QUOTES = [{"id":0,"topic":"On Repentance","quote":"\u201cThe only safe thing is repentance. Any spiritual structure must be built on it. We ceaselessly ask God for repentance and for nothing else. We shouldn\u2019t ask for light, miracles, prophesies and other gifts, but repentance. Repentance brings humility, and humility will bring grace of God, because it is a law: grace of God always comes to the humble. Therefore, humility is a must for our salvation. When we have acquired it then the grace of God will come and it will teach us what we should be doing for our salvation and for those close to us.\u201d -- Saint Paisios (1924-1994 AD), On Spiritual Life, Section 13","reference":"On Spiritual Life, Section 13","saint":"Saint Paisios (1924-1994 AD)","tags":["humility","repentance","salvation"]},{"id":1,"topic":"On Suffering and Trials","quote":"\"What are you telling me, the apostle seems to say [Romans 8:18], about wounds, torturers, punishments, hunger, deprivation, prisons, and chains? All these, and more besides are not even worth comparing to the glory, the reward, and the crowns prepared for us. For these trials end with this present life, but the heavenly joy is without end. Earthly afflictions are fleeting, while the blessings of heaven are eternal.\" -- Saint John Chrysostom (347-407 AD), Homilies on Romans, Homily 8","reference":"Homilies on Romans, Homily 8","saint":"Saint John Chrysostom (347-407 AD)","tags":["afflictions","crowns","suffering","trials"]},{"id":2,"topic":"On Suffering and Trials","quote":"\"For tribulations are in their own selves a goodly thing. How so? It is because they anoint us unto patient abiding.\" -- Saint John Chrysostom (347-407 AD), Homilies on Romans, Homily 9, Romans 5:3","reference":"Homilies on Romans, Homily 9, Romans 5:3","saint":"Saint John Chrysostom (347-407 AD)","tags":["patience","suffering","trials","tribulations"]},{"id":3,"topic":"On Suffering and Trials","quote":"\"For affliction rends\u00a0pride\u00a0away and prunes out all listlessness and exercises unto patience: it reveals the meanness of\u00a0human\u00a0things and leads unto much\u00a0philosophy. For all the\u00a0passions\u00a0give way before it,\u00a0envy, emulation,\u00a0lust, rule, desire of riches, of beauty, boastfulness,\u00a0pride,\u00a0anger; and the whole remaining swarm of these distempers.\" -- Saint John Chrysostom (347-407 AD), Homilies on Second Corinthians, Homily 26, 2nd Corinthians 2:10, Paragraph 4","reference":"Homilies on Second Corinthians, Homily 26, 2nd Corinthians 2:10, Paragraph 4","saint":"Saint John Chrysostom (347-407 AD)","tags":["afflictions","passions","pride","suffering","trials"]},{"id":4,"topic":"On Suffering and Trials","quote":"\"There are therefore\u00a0temptations\u00a0which we are not able to bear. And what are these? All, so to speak. For the ability lies in God's gracious influence; a power which we draw down by our own will. Wherefore that you may\u00a0know\u00a0and see that not only those which exceed our power, but not even these which are\u00a0'common to man'\u00a0is it possible without assistance from God.\" -- Saint John Chrysostom (347-407 AD), Homilies on First Corinthians, Homily 24, 1st Corinthians 10:13","reference":"Homilies on First Corinthians, Homily 24, 1st Corinthians 10:13","saint":"Saint John Chrysostom (347-407 AD)","tags":["suffering","temptations","trials"]},{"id":5,"topic":"On Suffering and Trials","quote":"\"In those afflictions and sufferings, in that patience and faith, are hidden the promises, and the glory, and the restitution of the good things of heaven, as the fruit is in the seed when it is sown in the earth, or in the tree when a graft is inserted into it and plastered with some degrading rotten stuff. Then they were proved to have in them the comeliness and the glory and the abounding fruit which clothes them; as the Apostle says, 'Through much tribulation we may enter into the kingdom of heaven [Acts 14:22]'.\" -- Saint Macarius of Egypt (300\u2013391 AD), Fifty Spiritual Homilies, Homily V, Page 51","reference":"Fifty Spiritual Homilies, Homily V, Page 51","saint":"Saint Macarius of Egypt (300\u2013391 AD)","tags":["afflictions","suffering","trials","tribulations"]},{"id":6,"topic":"On Suffering and Trials","quote":"\"We benefit greatly from our illnesses, so long as we endure them without complaint and glorify God, asking for His mercy.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On Illness, Page 227","reference":"Wounded By Love, On Illness, Page 227","saint":"Saint Porphyrios (1906-1991 AD)","tags":["illness","patience","suffering","trials"]},{"id":7,"topic":"On Suffering and Trials","quote":"\"Believe firmly: this tragedy is not the outcome of a chance concatenation of events. God Himself--God, whose ways are inscrutable--has confirmed them with the seal of His divine purpose. Why? Either as a punishment--but not necessarily for any sins of yours--or to try the power of your faith, and steel it. But whatever the reason, the whole occurrence is one more proof of His love of you, for 'Whom the Lord loveth He chasteneth, and scourgeth every son whom He receiveth...But if ye be without chastisement, whereof all are partakers, then are ye bastards and not sons [Heb. 12:6-8].' These are not words of our own invention. It is the Apostle Paul himself who thus testifies that you are a beloved child of God.\" -- Saint Macarius of Optina (1788-1860 AD), Letters of Elder Macarius of Optina, Conformity with the Will of God, Paragraph 4","reference":"Letters of Elder Macarius of Optina, Conformity with the Will of God, Paragraph 4","saint":"Saint Macarius of Optina (1788-1860 AD)","tags":["discipline","punishment","suffering","trials"]},{"id":8,"topic":"On Suffering and Trials","quote":"\"Sickness is sometimes for the cleansing of sins, and sometimes to humble our mind.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 26, Section 54","reference":"The Ladder of Divine Ascent, Step 26, Section 54","saint":"Saint John of the Ladder (579-649 AD)","tags":["discipline","punishment","sickness","trials"]},{"id":9,"topic":"On Angels and Demons","quote":"\u201cSome of the demons uplift us, some depress us, some harden, some comfort, some darken, some pretend to communicate enlightenment to us, some make us slothful, some make us cunning, some make us sad, and some cheerful.\u201d -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 26, Section 184","reference":"The Ladder of Divine Ascent, Step 26, Section 184","saint":"Saint John of the Ladder (579-649 AD)","tags":["afflictions","demons","temptations"]},{"id":10,"topic":"On Thoughts","quote":"\u201cIt is the privilege of the perfect to know unerringly whether a thought in the soul comes from their own consciousness, or from God, or from the demons; for the demons do not at first suggest everything that is repugnant. This is indeed a dark problem and hard to solve.\u201d -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 26, Section 188","reference":"The Ladder of Divine Ascent, Step 26, Section 188","saint":"Saint John of the Ladder (579-649 AD)","tags":["demons","thoughts"]},{"id":11,"topic":"On Prayer","quote":"\"We should see them [i.e., difficulties and tragedies] all as opportunities for prayer, for approaching God. That's the secret: how the man of God will transform everything into prayer...This is how sanctification takes place.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, Evia, Page 48","reference":"Wounded By Love, Evia, Page 48","saint":"Saint Porphyrios (1906-1991)","tags":["afflictions","prayer","suffering","temptations","trials","tribulations"]},{"id":12,"topic":"On Confession","quote":"\"Do not be deceived, son and obedient servant of the Lord, by the spirit of conceit, so that you confess your sins to your master as if they were another person's. You cannot escape shame except by shame. It is often the habit of demons to persuade us either to not confess, or to do so as if we were confessing another person's sins, or to lay the blame for our sin on others. Lay bare, lay bare your wound to the physician and, without being ashamed, say: 'It is my wound, Father, it is my plague, caused by my own negligence, and not by anything else. No one is to blame for this, no man, no spirit, no body, nothing but my own carelessness'.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 4, Section 62","reference":"The Ladder of Divine Ascent, Step 4, Section 62","saint":"Saint John of the Ladder (579-649 AD)","tags":["confession","forgiveness","shame"]},{"id":13,"topic":"On Despair and Despondency","quote":"\"Let this tyrant [i.e., despondency] be bound by the remembrance of your sins. Let us buffet him by manual labor. He should be brought into court by the thought of blessings to come.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 13, Section 15","reference":"The Ladder of Divine Ascent, Step 13, Section 15","saint":"Saint John of the Ladder (579-649 AD)","tags":["despair","despondency","future blessings"]},{"id":14,"topic":"On Suffering and Trials","quote":"\u201cDo not claim to have acquired virtue unless you have suffered affliction, for without affliction virtue has not been tested.\u201d -- Saint Mark the Ascetic (died ~430 AD), Philokalia, On the Spiritual Law: Two Hundred Texts, Section 66","reference":"Philokalia (Vol. I), On the Spiritual Law: Two Hundred Texts, Section 66","saint":"Saint Mark the Ascetic (died ~430 AD)","tags":["afflictions","suffering","testing","trials","tribulations","virtue"]},{"id":15,"topic":"On Suffering and Trials","quote":"\"As a dammed stream of water rushes upwards, so often the soul that is pressed by dangers ascends to God and is saved through penitence.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Brief Summary of All Previous Steps, Section 28, Page 157","reference":"The Ladder of Divine Ascent, Brief Summary of All Previous Steps, Section 28, Page 157","saint":"Saint John of the Ladder (579-649 AD)","tags":["afflictions","suffering","trials","tribulations"]},{"id":16,"topic":"On Faith and Works","quote":"\"Do not say that you are the temple of the Lord, writes Jeremiah [Jeremiah 7:4]; nor should you say that faith alone in our Lord Jesus Christ can save you, for this is impossible unless you also acquire love for Him through your works. As for faith by itself, \u2018the devils also believe, and tremble [James 2:19]\u2019.\" -- Saint Maximos the Confessor (580-662 AD), Philokalia, Four Hundred Texts on Love, First Century, Section 39","reference":"Philokalia (Vol. I), Four Hundred Texts on Love, First Century, Section 39","saint":"Saint Maximus the Confessor (580-662 AD)","tags":["faith alone","love","works"]},{"id":17,"topic":"On Suffering and Trials","quote":"\"Sometimes men are tested by pleasure, sometimes by distress or by physical suffering. By means of His prescriptions the Physician of souls administers the remedy according to the cause of the passions lying hidden in the soul.\" -- Saint Maximos the Confessor (580-662 AD), Philokalia, Four Hundred Texts on Love, Second Century, Section 44","reference":"Philokalia (Vol. I), Four Hundred Texts on Love, Second Century, Section 44","saint":"Saint Maximus the Confessor (580-662 AD)","tags":["afflictions","healing","passions","suffering","testing","trials","tribulations"]},{"id":18,"topic":"On Suffering and Trials","quote":"\"Trials are sent to some so as to take away past sins, to others so as to eradicate sins now being committed, and to yet others so as to forestall sins which may be committed in the future. These are distinct from the trials that arise in order to test men in the way that Job was tested.\" -- Saint Maximos the Confessor (580-662 AD), Philokalia, Four Hundred Texts on Love, Second Century, Section 45","reference":"Philokalia (Vol. I), Four Hundred Texts on Love, Second Century, Section 45","saint":"Saint Maximus the Confessor (580-662 AD)","tags":["afflictions","sin","suffering","testing","trials"]},{"id":19,"topic":"On Suffering and Trials","quote":"\"For without trials God's providence is not seen, and you cannot obtain boldness before God, nor learn the wisdom of the Spirit, nor can divine longing be established in you.\" -- Saint Isaac the Syrian (613-700 AD), Ascetical Homilies, Homily 3, Page 26","reference":"Ascetical Homilies, Homily 3, Page 26","saint":"Saint Isaac the Syrian (613-700 AD)","tags":["boldness","providence","trials","wisdom"]},{"id":20,"topic":"On Suffering and Trials","quote":"\"Let whatever good or evil things that befall the flesh be reckoned by you as dreams. For it is not only with death that you will have release from them, but often before death they retire and leave you alone.\" -- Saint Isaac the Syrian (613-700 AD), Ascetical Homilies, Homily 1, Page 8","reference":"Ascetical Homilies, Homily 1, Page 8","saint":"Saint Isaac the Syrian (613-700 AD)","tags":["afflictions","dreams","suffering","trials","tribulations"]},{"id":21,"topic":"On Suffering and Trials","quote":"\"The aim of divine providence is to unite by means of true faith and spiritual love those separated in various ways by vice. Indeed, the Savior endured His sufferings so that \u2018He should gather together into one the scattered children of God\u2019 [John 11: 52]. Thus, he who does not resolutely bear trouble, endure affliction, and patiently sustain hardship, has strayed from the path of divine love and from the purpose of providence.\" -- Saint Maximos the Confessor (580-662 AD), Philokalia, Four Hundred Texts on Love, Fourth Century, Section 17","reference":"Philokalia (Vol. I), Four Hundred Texts on Love, Fourth Century, Section 17","saint":"Saint Maximus the Confessor (580-662 AD)","tags":["afflictions","providence","suffering","trials"]},{"id":22,"topic":"On Suffering and Trials","quote":"\"When a sinful soul does not accept the afflictions that come to it, the angels say: 'We would have healed Babylon, but she was not healed' [Jeremiah 51:9].\" -- Saint Mark the Ascetic (died ~430 AD), Philokalia, On Those who Think that They are Made Righteous by Works, Two Hundred and Twenty-Six Texts, Section 82","reference":"Philokalia (Vol. I), On Those who Think that They are Made Righteous by Works, Two Hundred and Twenty-Six Texts, Section 82","saint":"Saint Mark the Ascetic (died ~430 AD)","tags":["afflictions","healing","suffering","trials"]},{"id":23,"topic":"On Confession","quote":"\"Don't let\u2019s turn back to sins we have confessed. The recollection of sins is harmful. Have we asked for forgiveness? Then the matter is closed.\" -- Saint Porphyrios (1906-1991 AD), Wounded by Love, God Forgives Everything with Confession, Page 175","reference":"Wounded by Love, God Forgives Everything with Confession, Page 175","saint":"Saint Porphyrios (1906-1991 AD)","tags":["confession","forgiveness"]},{"id":24,"topic":"On Confession","quote":"\"God forgives everything with confession. We mustn't turn back and enmesh ourselves in despair. We need to be humble servants before God and have a sense of gratitude for the forgiveness of our sins.\" -- Saint Porphyrios (1906-1991 AD), Wounded by Love, God Forgives Everything with Confession, Page 176","reference":"Wounded by Love, God Forgives Everything with Confession, Page 176","saint":"Saint Porphyrios (1906-1991 AD)","tags":["confession","despair","forgiveness","gratitude"]},{"id":25,"topic":"On Spiritual Warfare","quote":"\"Therefore if a soul be overburdened with sins, if it be guilty of all the crimes in the world, if it be defiled beyond imagination;\u2014if, at the same time, to the extent of its desire and strength, it uses every means and endeavour to become free of sin and turn to the path of good, but cannot get stable in anything right, however small, and, on the contrary, sinks ever deeper and deeper into evil; even if it is all that, it must not weaken in its trust of God or fall away from Him. It must not abandon its spiritual weapons and strivings but must fight and fight, struggling with itself and with its enemies with all its courage and untiring efforts. For know and understand, that in this unseen war all are losers except a man who never ceases to struggle and keep his trust in God; for God never abandons those who fight in His armies, although at times He lets them suffer wounds.\" -- Saint Nikodemus of the Holy Mountain (1749\u20131809 AD), Unseen Warfare, Part One, Cap 6, Paragraph 2","reference":"Unseen Warfare, Part One, Cap 6, Paragraph 2","saint":"Saint Nikodemus of the Holy Mountain (1749\u20131809 AD)","tags":["afflictions","despair","spiritual warfare","struggle","suffering","trials"]},{"id":26,"topic":"On Despair and Despondency","quote":"\"Just as the Lord is solicitous about our salvation, so too the murderer of men, the devil, strives to lead a man into despair.\" -- Saint Seraphim of Sarov (1754-1833 AD), Little Russian Philokalia (Vol. I), 14 - Despair","reference":"Little Russian Philokalia (Vol. I), 14 - Despair","saint":"Saint Seraphim of Sarov (1754-1833 AD)","tags":["despair","the devil"]},{"id":27,"topic":"On God's Mercy and Forgiveness","quote":"\"What are your sins in comparison to God's mercy, whatever they be, if only you truly repent of them.\" -- Saint John of Kronstadt (1829-1908 AD), My Life in Christ, Part I, Page 61","reference":"My Life in Christ, Part I, Page 61","saint":"Saint John of Kronstadt (1829-1908 AD)","tags":["God's mercy","repentance","sin"]},{"id":28,"topic":"On Despair and Despondency","quote":"\"It is bad to despair, because someone who despairs becomes embittered and loses his willingness and strength. Someone who has hope, on the contrary, advances forward.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On Devine Eros, Page 98","reference":"Wounded By Love, On Divine Eros, Page 98","saint":"Saint Porphyrios (1906-1991 AD)","tags":["despair","hope"]},{"id":29,"topic":"On Despair and Despondency","quote":"\"When you lose the divine grace, don't do anything. Continue your life and your struggle simply and normally until, without anxiety, you will be filled again with love and longing for Christ. And then everything will be fine. And then grace will fill you and give you joy. One secret is to be found in the divine offices. Abandon yourself to these and the grace of God will overtake you mystically.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On Prayer, Page 118","reference":"Wounded By Love, On Prayer, Page 118","saint":"Saint Porphyrios (1906-1991 AD)","tags":["anxiety","divine grace","struggle"]},{"id":30,"topic":"On Despair and Despondency","quote":"\"It is not healthy to be excessively downcast on account of your sins and to turn with such revulsion against your evil self that you end up in despair. Despondency is the worst thing. It is a snare set by Satan to make a person lose his appetite for spiritual things and to bring him into a state of despair, inactivity, and negligence. In this state a person is unable to do anything and is rendered useless...He is brought into a sense of inferiority and consumed by fruitless self-reproach. Do you know what a destructive thing that is? It is pseudo-humility.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On the Mystery of Repentance, Page 176","reference":"Wounded By Love, On the Mystery of Repentance, Page 176","saint":"Saint Porphyrios (1906-1991 AD)","tags":["demons","despair","despondency","downcast","sin"]},{"id":31,"topic":"On Despair and Despondency","quote":"\"The man who despairs of himself when he hears of the supernatural virtues of the saints is most unreasonable. On the contrary, they teach you supremely one of two things: either they rouse you to emulation by their holy courage, or they lead you by way of thrice-holy humility to deep self contempt and realization of your inherent weakness.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 26, Section 126","reference":"The Ladder of Divine Ascent, Step 26, Section 126","saint":"Saint John of the Ladder (579-649 AD),","tags":["despair","emulate","instruction","virtue"]},{"id":32,"topic":"On Despair and Despondency","quote":"\"Patiently accept your falls, and having immediately arisen, run [to God], do not stop like children who sit in the place where they\u2019ve fallen, crying and sobbing inconsolably.\" -- Saint Nektarios of Aegina (1846-1920 AD), Path to Happiness, Spiritual Warfare","reference":"Path to Happiness, Spiritual Warfare","saint":"Saint Nektarios of Aegina (1846-1920 AD)","tags":["repentance","sin"]},{"id":33,"topic":"On Repentance","quote":"\"Patiently accept your falls, and having immediately arisen, run [to God], do not stop like children who sit in the place where they\u2019ve fallen, crying and sobbing inconsolably.\" -- Saint Nektarios of Aegina (1846-1920 AD), Path to Happiness, Spiritual Warfare","reference":"Path to Happiness, Spiritual Warfare","saint":"Saint Nektarios of Aegina (1846-1920 AD)","tags":["hope","repentance","sin"]},{"id":34,"topic":"On Spiritual Warfare","quote":"\"If you struggle in the good fight, God will strengthen you. In struggles we discover our weaknesses, our inadequacies, and our defects. It is the mirror of our spiritual state. Whoever does not struggle will not come to know himself.\" -- Saint Nektarios of Aegina (1846-1920 AD), Path to Happiness, Spiritual Warfare","reference":"Path to Happiness, Spiritual Warfare","saint":"Saint Nektarios of Aegina (1846-1920 AD)","tags":["spiritual warfare","struggle"]},{"id":35,"topic":"On Despair and Despondency","quote":"\"Be attentive also to your insignificant falls. If from inattentiveness some sin happens with you, do not despair but immediately take yourself in hand and fall down before God, Who has the power to raise you up.\" -- Saint Nektarios of Aegina (1846-1920 AD), Path to Happiness, Spiritual Warfare","reference":"Path to Happiness, Spiritual Warfare","saint":"Saint Nektarios of Aegina (1846-1920 AD)","tags":["despair","repentance","sin"]},{"id":36,"topic":"On Heresy","quote":"\"In the case of those who malevolently dispute with us, whether unbelievers or heretics, we should desist after we have twice admonished them [Titus 3:10]. But in the case of those who wish to learn the truth let us never grow weary in well-doing [Galatians 6:9]. However, we should use both opportunities for the establishment of our own heart [Hebrews 13:9].\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 26, Section 125","reference":"The Ladder of Divine Ascent, Step 26, Section 125","saint":"Saint John of the Ladder (579-649 AD)","tags":["dealing with heresy","heretics","unbelievers"]},{"id":37,"topic":"On Love and Mercy","quote":"\"Love sinners, but hate their works; and do not despise them for their faults, lest you be tempted by the same.\" -- Saint Isaac the Syrian (613-700 AD), Ascetical Homilies, Homily 5, Page 51","reference":"Ascetical Homilies, Homily 5, Page 51","saint":"Saint Isaac the Syrian (613-700 AD)","tags":["love","loving others","sin","sinners","temptations"]},{"id":38,"topic":"On Almsgiving","quote":"\"Do you see what great profit arises to us from the poor? Should you take them away, you would take away the great hope of our salvation.\" -- Saint John Chrysostom (347-407 AD), Homilies on Matthew, Homily 78, Section 2","reference":"Homilies on Matthew, Homily 78, Section 2","saint":"Saint John Chrysostom (347-407 AD)","tags":["almsgiving","salvation"]},{"id":39,"topic":"On Temptations and Sin and the Passions","quote":"\"The mother of lust is gluttony, and the mother of despondency is vainglory; sorrow and also anger are the offspring of those three (i.e., cupidity, sensuality, ambition); and the mother of pride is vain glory.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 26, Section 39","reference":"The Ladder of Divine Ascent, Step 26, Section 39","saint":"Saint John of the Ladder (579-649 AD)","tags":["anger","despondency","gluttony","passions","pride","sin","vainglory"]},{"id":40,"topic":"On Temptations and Sin and the Passions","quote":"\"Some of the faithful, and even of the unfaithful, have been deserted by the passions, all except one; and that one has been left as a paramount evil which fully takes the place of all the others, for it is so harmful that it can even cast down from heaven.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 26, Section 62","reference":"The Ladder of Divine Ascent, Step 26, Section 62","saint":"Saint John of the Ladder (579-649 AD)","tags":["losing salvation","passions","sin"]},{"id":41,"topic":"On Spiritual Warfare","quote":"\"We have received from God self-control, forbearance, restraint, fortitude, patience, and the like, which are great and holy powers, helping us to resist the enemy's attacks. If we cultivate these powers and have them at our disposal, we do not regard anything that befalls us as painful, grievous or unbearable, realizing that it is human and can be overcome by the virtues within us. The unintelligent do not take this into account; they do not understand that all things happen for our benefit, rightly and as they should, so that our virtues may shine and we ourselves be crowned by God\" -- Saint Anthony the Great (251-356 AD), Philokalia, On the Character of Men and on the Virtuous Life, One Hundred and Seventy Texts, Section 3","reference":"Philokalia (Vol. I), On the Character of Men and on the Virtuous Life, One Hundred and Seventy Texts, Section 3","saint":"Saint Anthony the Great (251-356 AD)","tags":["afflictions","crowns","patience","self-control","spiritual warfare","suffering","suffering is beneficial","trials","tribulations","virtue"]},{"id":42,"topic":"On Suffering and Trials","quote":"\"He allows the tempter to remain with us and for as long as we must wait to be revived through patience and secure passionlessness!\" --  Saint Seraphim of Sarov (1754-1833 AD), Little Russian Philokalia (Vol. I), 14 - Despair, Paragraph 2","reference":"Little Russian Philokalia (Vol. I), 14 - Despair, Paragraph 2","saint":"Saint Seraphim of Sarov (1754-1833 AD)","tags":["patience","suffering is beneficial","temptations"]},{"id":43,"topic":"On Faith and Works","quote":"\"True faith cannot be without works; one who truly believes will unfailingly have works as well.\" -- Saint Seraphim of Sarov (1754-1833 AD), Little Russian Philokalia (Vol. I), 4 - Faith, Paragraph 3","reference":"Little Russian Philokalia (Vol. I), 4 - Faith, Paragraph 3","saint":"Saint Seraphim of Sarov (1754-1833 AD)","tags":["faith alone","works"]},{"id":44,"topic":"On Suffering and Trials","quote":"\"One should always endure any trial for the sake of God with gratitude. Our life is a single minute in comparison with eternity; and therefore, according to the Apostle, 'the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us [Romans 8:18]'.\" -- Saint Seraphim of Sarov (1754-1833 AD), Little Russian Philokalia (Vol. I), 16 - Patience and Humility, Paragraph 1","reference":"Little Russian Philokalia (Vol. I), 16 - Patience and Humility, Paragraph 1","saint":"Saint Seraphim of Sarov (1754-1833 AD)","tags":["gratitude","patience","suffering","trials"]},{"id":45,"topic":"On Temptations and Sin and the Passions","quote":"\"If you wish to be in control of your soul and body, forestall the passions by rooting out their causes.\" -- Saint Thalassios the Libyan (died 648 AD), Philokalia (Vol. II), On Love, Self-control and Life in Accordance with the Intellect, First Century, Section 64","reference":"Philokalia (Vol. II), On Love, Self-control and Life in Accordance with the Intellect, First Century, Section 64","saint":"Saint Thalassios the Libyan (died 648 AD)","tags":["passions","self-control","sin"]},{"id":46,"topic":"On Temptations and Sin and the Passions","quote":"\"Some say that we fall into the same sins because we have been unable to correct our former sins through the inadequacy of our repentance. But it may be asked: Have all those who have not fallen into the same kind of sin really repented as they should? Some fall into the same sins either because they have sunk into a deep forgetfulness of their former sins, or because they imagine in their own pleasure-loving way that God is merciful, or they have lost all hope and their own salvation. I do not know whether anyone will blame me if I say that their trouble arises because they have not been strong enough to bind the foe who is dominating them through the tyranny of habit.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 26, Section 171","reference":"The Ladder of Divine Ascent, Step 26, Section 171","saint":"Saint John of the Ladder (579-649 AD)","tags":["God's mercy","repentance","satan","sin"]},{"id":47,"topic":"On Temptations and Sin and the Passions","quote":"\"At the moment of temptation, the easiest thing to do is to turn to your loved one, to God, and to look to Him steadfastly and expectantly and you will be filled with strength at once. As soon as you see evil coming to get you, ignore it and run to God's embrace...And so when you go towards good, you cease to remember evil.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On Spiritual Struggle, Page 151","reference":"Wounded By Love, On Spiritual Struggle, Page 151","saint":"Saint Porphyrios (1906-1991 AD)","tags":["overcoming the passions","temptations"]},{"id":48,"topic":"On Temptations and Sin and the Passions","quote":"\"He who has piously destroyed within him the three passions [i.e., gluttony, cupidity (extreme greed), and vainglory] has destroyed the five [i.e., lust, anger, despair, despondency, and pride] too; but he who has been negligent about the former will not conquer even one passion.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 26, Section 2","reference":"The Ladder of Divine Ascent, Step 26, Section 2","saint":"Saint John of the Ladder (579-649 AD)","tags":["anger","despair","despondency","gluttony","greed","lust","overcoming the passions","passions","pride","vainglory"]},{"id":49,"topic":"On Temptations and Sin and the Passions","quote":"\"When our praisers, or rather our seducers, begin to praise us, let us briefly call to mind the multitude of our sins, and we shall find ourselves unworthy of what is said or done in our honor.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 22, Section 42","reference":"The Ladder of Divine Ascent, Step 22, Section 42","saint":"Saint John of the Ladder (579-649 AD)","tags":["pride","remembrance of sin","sin","unworthiness"]},{"id":50,"topic":"On Temptations and Sin and the Passions","quote":"\"As one who has suffered a prolonged illness can scarcely obtain health in an instant, so it is impossible suddenly to overcome the passions, or even one passion.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Brief Summary of All the Previous Steps, Section 55","reference":"The Ladder of Divine Ascent, Brief Summary of All the Previous Steps, Section 55","saint":"Saint John of the Ladder (579-649 AD)","tags":["overcoming the passions","passions","sin"]},{"id":51,"topic":"On Temptations and Sin and the Passions","quote":"\"To yield and give way to our passions is the lowest slavery, even as to rule over them is the only liberty.\" -- Saint Justin Martyr (100-165 AD), Fragments of St. Justin Martyr, Fragment 18","reference":"Fragments of St. Justin Martyr, Fragment 18","saint":"Saint Justin Martyr (100-165 AD)","tags":["freedom","overcoming the passions","passions","slavery"]},{"id":52,"topic":"On Angels and Demons","quote":"\"Conscious perception produces either the cessation or lessening of evil; and it is the offspring of conscience. And conscience is the word and conviction of our guardian angel given to us from the time of baptism. That is why we find that the unbaptized do not feel such keen pangs of remorse in their soul for their bad deeds.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Brief Summary of All the Previous Steps, Section 64","reference":"The Ladder of Divine Ascent, Brief Summary of All the Previous Steps, Section 64","saint":"Saint John of the Ladder (579-649 AD)","tags":["baptism","conscience","guardian angel","overcoming the passions","sin","unbaptized"]},{"id":53,"topic":"On How to Live as a Christian","quote":"\"The lessening of evil breeds abstinence from evil; and abstinence from evil is the beginning of repentance; and the beginning of repentance is the beginning of salvation; and the beginning of salvation is a good intention; and a good intention is the mother of labors. And the beginning of labors is the virtues; the beginning of the virtues is a flowering, and the flowering of virtue is the beginning of activity. And the offspring of virtue is perseverance; and the fruit and offspring of persevering practice is habit, and the child of habit is character. Good character is the mother of fear; and fear gives birth to the keeping of commandments in which I include both heavenly and earthly. The keeping of the commandments is a sign of love; and the beginning of love is an abundance of humility; and an abundance of humility is the daughter of dispassion; and the acquisition of the latter is the fullness of love, that is to say the perfect indwelling of God in those who through dispassion are pure in heart. For they shall see God [Matthew 5:8]. And to Him the glory for all eternity. Amen.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Brief Summary of All the Previous Steps, Section 65","reference":"The Ladder of Divine Ascent, Brief Summary of All the Previous Steps, Section 65","saint":"Saint John of the Ladder (579-649 AD)","tags":["christian living","humility","love","overcoming the passions","perseverance","repentance","salvation","sin","virtue"]},{"id":54,"topic":"On Foreknowledge and Free Will","quote":"\"Someone asked one of those who could see: 'Why does God, who foresees their falls, adorn some with gifts and wonder-working powers?' And he replied: 'In order to make other Spiritual men more careful, and to demonstrate the freedom of the human will, and to cause those who fall to be without any excuse at the last judgment.'\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 26, Section 131","reference":"The Ladder of Divine Ascent, Step 26, Section 131","saint":"Saint John of the Ladder (579-649 AD)","tags":["foreknowledge","free will","judgment","sin"]},{"id":55,"topic":"On How to Live as a Christian","quote":"\"Intelligent men have no need to listen to much talk, but should attend only to that which is profitable and guided by God's will. For in this way men regain life and eternal light.\" -- Saint Anthony the Great (251-356 AD), Philokalia (Vol. I), On the Character of Men and on the Virtuous Life, One Hundred and Seventy Texts, Section 24","reference":"Philokalia (Vol. I), On the Character of Men and on the Virtuous Life, One Hundred and Seventy Texts, Section 24","saint":"Saint Anthony the Great (251-356 AD)","tags":["intelligence","knowledge","silence","will of God"]},{"id":56,"topic":"On How to Live as a Christian","quote":"\"There is no profit in studying doctrines unless the life of one's soul is acceptable and conforms to God's will. The cause of all evils is delusion, self-deception and ignorance of God.\" -- Saint Anthony the Great (251-356 AD), Philokalia (Vol. I), On the Character of Men and on the Virtuous Life, One Hundred and Seventy Texts, Section 26","reference":"Philokalia (Vol. I), On the Character of Men and on the Virtuous Life, One Hundred and Seventy Texts, Section 26","saint":"Saint Anthony the Great (251-356 AD)","tags":["deception","delusion","doctrines","knowledge","studying","will of God"]},{"id":57,"topic":"On Suffering and Trials","quote":"\"Those who consider it a misfortune to lose children, slaves, money or any other of their belongings, must realize that in the first place they should be satisfied with what is given them by God; and then, when they have to give it back, they should be ready to do so gratefully, without any indignation at being deprived of it, or rather at giving it back - for since they have been enjoying the use of what was not their own, they are now in fact returning it.\" -- Saint Anthony the Great (251-356 AD), Philokalia (Vol. I), On the Character of Men and on the Virtuous Life, One Hundred and Seventy Texts, Section 36","reference":"Philokalia (Vol. I), On the Character of Men and on the Virtuous Life, One Hundred and Seventy Texts, Section 36","saint":"Saint Anthony the Great (251-356 AD)","tags":["gratitude","misfortune","providence","suffering","trials"]},{"id":58,"topic":"On Temptations and Sin and the Passions","quote":"\"A most learned old man spiritually admonished a proud brother, but he in his blindness said: 'Excuse me, Father, I am not proud.' The wise old man said to him: 'What clear proof of this passion could you have given us, son, than to say, \\\"I am not proud\\\"?'\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 23, Section 14","reference":"The Ladder of Divine Ascent, Step 23, Section 14","saint":"Saint John of the Ladder (579-649 AD)","tags":["passions","pride","sin"]},{"id":59,"topic":"On Thoughts","quote":"\"He who is troubled by the spirit of blasphemy and wants to be delivered from it should know for certain that it is not his soul that is the cause of such thoughts but the impure demon who once said to the Lord: 'All these things will I give Thee if Thou wilt fall down and worship me [Matthew 4:9].' And so let us too humiliate him and,  without paying the least regard to his suggestion, say to him: 'Get thee behind me, Satan! I shall worship the Lord my God, and Him only will I serve [Matthew 4:10]. Thy labor and thy word will return upon thy head, and thy blasphemies will come down upon thy crown [Psalm 7:17] in the present and in the future world. Amen'.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 23, Section 46","reference":"The Ladder of Divine Ascent, Step 23, Section 46","saint":"Saint John of the Ladder (579-649 AD)","tags":["blasphemy","demons","overcoming the passions","thoughts"]},{"id":60,"topic":"On Thoughts","quote":"\"He who wants to grapple with the demon of blasphemy in any other way is like a man trying to hold lightning in his hands. For how will you catch, or contend and grapple with one who bursts into the heart suddenly like the wind, utters words quicker than a flash, and immediately vanishes? All other enemies stop, wrestle, linger and give time to those who wish to struggle with them. But not this one: he has scarcely appeared, and he is gone; he has hardly said a word, and he is away.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 23, Section 47","reference":"The Ladder of Divine Ascent, Step 23, Section 47","saint":"Saint John of the Ladder (579-649 AD)","tags":["blasphemy","demons","how demons operate"]},{"id":61,"topic":"On Parenting","quote":"\"Generally the parents are to blame for the bad behavior of the children. And their behavior is not improved by reprimands, disciplining, or strictness. If the parents do not pursue a life of holiness and if they don't engage in spiritual struggle, they make great mistakes and transmit the faults they have within them. If the parents do not live a holy life and do not display love towards each other, the devil torments the parents with the reactions of the children.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On the Upbringing of Children, Page 196","reference":"Wounded By Love, On the Upbringing of Children, Page 196","saint":"Saint Porphyrios (1906-1991 AD)","tags":["children","discipline","holiness","parenting","satan","spiritual warfare","struggle"]},{"id":62,"topic":"On Parenting","quote":"\"Parents...often cause hurt to a child for some act of misbehavior by scolding them excessively. The child is then wounded. Even if you don't scold the child outwardly, but bristle with anger inwardly or look fiercely at the child, the child understands.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On the Upbringing of Children, Page 198","reference":"Wounded By Love, On the Upbringing of Children, Page 198","saint":"Saint Porphyrios (1906-1991 AD)","tags":["anger","children","parenting","scolding"]},{"id":63,"topic":"On Parenting","quote":"\"[Parents] who are always standing over their children and pressurizing them, that is over-protecting them, have failed in their task. You need to leave the child alone to take an interest in its own progress. Then you will succeed. When you are always standing over them, the children react. They become lethargic and weak-willed and generally are unsuccessful in life. This is a kind of over-protectiveness that leaves the children immature.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On the Upbringing of Children, Page 199","reference":"Wounded By Love, On the Upbringing of Children, Page 199","saint":"Saint Porphyrios (1906-1991 AD)","tags":["children","over-protection","parenting"]},{"id":64,"topic":"On Parenting","quote":"\"A [parent] should not be satisfied by giving her child a physical caress, but should also coddle it with a caress of prayer.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On the Upbringing of Children, Pages 199-200","reference":"Wounded By Love, On the Upbringing of Children, Pages 199-200","saint":"Saint Porphyrios (1906-1991 AD)","tags":["children","parenting","prayer"]},{"id":65,"topic":"On Love and Mercy","quote":"\"Love needs to be sincere. And only the love of God is sincere love. To a person whom we find tiresome and troublesome, love needs to be offered in a subtle manner without the person being aware that we are striving to love him. It shouldn't be given much outward expression, because then the person will react.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On Love for One's Neighbor, Page 184","reference":"Wounded By Love, On Love for One's Neighbor, Page 184","saint":"Saint Porphyrios (1906-1991 AD)","tags":["christian living","love","loving others","sincerity"]},{"id":66,"topic":"On Silence","quote":"\"Silence saves us from all evils. Restraint of the tongue is a great thing. In a mystical way silence radiates out to our neighbour.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On Love for One's Neighbor, Page 184","reference":"Wounded By Love, On Love for One's Neighbor, Page 184","saint":"Saint Porphyrios (1906-1991 AD)","tags":["overcoming the passions","self-control","silence","virtue"]},{"id":67,"topic":"On Parenting","quote":"\"Pray and then speak. That's what to do with your children. If you are constantly lecturing them, you'll become tiresome and when they grow up, they'll feel a kind of oppression. Prefer prayer and speak to them through prayer. Speak to God and God will speak to their hearts.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On the Upbringing of Children, Page 203","reference":"Wounded By Love, On the Upbringing of Children, Page 203","saint":"Saint Porphyrios (1906-1991 AD)","tags":["children","parenting","prayer"]},{"id":68,"topic":"On Parenting","quote":"\"When you praise children constantly and indiscriminately, they fall prey to the temptations of the evil one. He sets the mill of egotism in motion, and accustomed as they are to praise from their parents and teachers, they make progress at school perhaps, but what is the gain? In life they will be egotists and not Christians. Egotists can never be Christians. Egotists desire to be praised constantly by everyone, for everyone to love them, and for everyone to speak, well of them and this is something that our God, our Church, and our Christ do not want.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, On the Upbringing of Children, Page 208","reference":"Wounded By Love, On the Upbringing of Children, Page 208","saint":"Saint Porphyrios (1906-1991 AD)","tags":["children","egotism","parenting","praise","pride","satan"]},{"id":69,"topic":"On Obedience","quote":"\"I can't give you an example of what real obedience is. It's not that we have a discussion about the virtue of obedience and then I say to you, go and do a somersault, and you obey. That's not obedience. You need to be entirely carefree and not thinking at all about the matter of obedience, and then suddenly you are asked to do something and you are ready to do it joyfully.\" -- Saint Porphyrios (1906-1991 AD), Wounded By Love, The Holy Mountain - Kavsokalyvia, Page 19","reference":"Wounded By Love, The Holy Mountain - Kavsokalyvia, Page 19","saint":"Saint Porphyrios (1906-1991 AD)","tags":["obedience","virtue"]},{"id":70,"topic":"On Love and Mercy","quote":"\"One must not nurse in one's heart malice or hatred towards a neighbor who bears ill-will; but we must strive to love him and, as much as possible, do good, following the teaching of our Lord Jesus Christ: Love your enemies, do good to them that hate you [Matthew 5:44].\" -- Saint Seraphim of Sarov (1754-1833 AD), Little Russian Philokalia (Vol. I), 21 - Forgiveness of Offenses, Paragraph 2","reference":"Little Russian Philokalia (Vol. I), 21 - Forgiveness of Offenses, Paragraph 2","saint":"Saint Seraphim of Sarov (1754-1833 AD)","tags":["christian living","forgiveness","hate","love","loving others"]},{"id":71,"topic":"On Faith and Works","quote":"\"Faith produces fear in us, and fear compels us to repent and to set ourselves to work.\" -- Saint Issac the Syrian, Ascetical Homilies, Homily 47, Page 227","reference":"Ascetical Homilies, Homily 47, Page 227","saint":"Saint Isaac the Syrian (613-700 AD),","tags":["faith","fear","repentance","works"]},{"id":72,"topic":"On How to Live as a Christian","quote":"\"If you compel your body when it is weak to labors that exceed its strength, you will instill darkness upon darkness into your soul and bring greater confusion upon her.\" -- Saint Isaac the Syrian (613-700 AD), Ascetical Homilies, Homily 48, Page 235","reference":"Ascetical Homilies, Homily 48, Page 235","saint":"Saint Isaac the Syrian (613-700 AD)","tags":["christian living","works"]},{"id":73,"topic":"On Silence","quote":"\"If you guard your tongue, my brother, God will give you the gift of compunction of heart so that you may see your soul, and thereby you will enter into spiritual joy. But if your tongue defeats you\u2014believe me in what I say to you\u2014you will never be able to escape from darkness. If you do not have a pure heart, at least have a pure mouth, as the blessed John said\" -- Saint Isaac the Syrian (613-700 AD), Ascetical Homilies, Homily 48, Page 236","reference":"Ascetical Homilies, Homily 48, Page 236","saint":"Saint Isaac the Syrian (613-700 AD)","tags":["compunction","self-control","silence","tongue"]},{"id":74,"topic":"On Judgmentalism","quote":"\"He who busies himself with the sins of others, or judges his brother on suspicion, has not yet even begun to repent or to examine himself so as to discover his own sins.\" -- Saint Maximus the Confessor (580-662 AD), Philokalia (Vol. I), Four Hundred Texts on Love, Third Century, Section 55","reference":"Philokalia (Vol. I), Four Hundred Texts on Love, Third Century, Section 55","saint":"Saint Maximus the Confessor (580-662 AD)","tags":["judgmentalism","knowing your sins","repentance"]},{"id":75,"topic":"On Judgmentalism","quote":"\"We must not judge anyone, even if with our own eyes we have seen someone sinning, or walking in transgression of God's commandments. For according to the word of God: Judge not, that ye be not judged [Matthew 7:1].\" -- Saint Seraphim of Sarov (1754-1833 AD), Little Russian Philokalia (Vol. I), 20 - Do Not Judge Your Neighbor, Paragraph 1","reference":"Little Russian Philokalia (Vol. I), 20 - Do Not Judge Your Neighbor, Paragraph 1","saint":"Saint Seraphim of Sarov (1754-1833 AD)","tags":["commandments","judgmentalism","sin"]},{"id":76,"topic":"On Judgmentalism","quote":"\"If you see someone falling into sin at the very moment of his death, even then do not judge him, because the Divine judgment is hidden from men. Some have fallen openly into great sins, but they have done greater good deeds in secret; so their critics were tricked.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 10, Section 8","reference":"The Ladder of Divine Ascent, Step 10, Section 8","saint":"Saint John of the Ladder (579-649 AD)","tags":["good deeds","judgmentalism","sin","works"]},{"id":77,"topic":"On Judgmentalism","quote":"\"Do not regard the feelings of a person who speaks to you about his neighbor disparagingly, but rather say to him: 'Stop, brother! I fall into graver sins every day, so how can I criticize him?'\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 10, Section 7","reference":"The Ladder of Divine Ascent, Step 10, Section 7","saint":"Saint John of the Ladder (579-649 AD)","tags":["gossip","judgmentalism","slander"]},{"id":78,"topic":"On How to Live as a Christian","quote":"\"He who hates his sins will cease to sin, and he who confesses them will receive forgiveness. It is impossible for a man to forsake the habit of sin if he does not first acquire a hatred of sin; and it is impossible to receive forgiveness before a confession of iniquities. With the latter (i.e. confession) there is real abasement, and with the former (i.e. hatred of sin) there is remorse arising from shame that cleaves to the heart.\" -- Saint Isaac the Syrian (613-700 AD), Ascetical Homilies, Homily 32, Page 152","reference":"Ascetical Homilies, Homily 32, Page 152","saint":"Saint Isaac the Syrian (613-700 AD)","tags":["confession","forgiveness","knowing your sins","overcoming the passions","remembrance of sin","sin"]},{"id":79,"topic":"On Judgmentalism","quote":"\"What is the sign that a man has attained to purity of heart, and when does a man know that his heart has entered into purity? When he sees all men as good and none appears to him to be unclean and defiled. Then in very truth his heart is pure.\" -- Saint Isaac the Syrian (613-700 AD), Ascetical Homilies, Homily 37, Page 177","reference":"Ascetical Homilies, Homily 37, Page 177","saint":"Saint Isaac the Syrian (613-700 AD)","tags":["judgmentalism","purity"]},{"id":80,"topic":"On Judgmentalism","quote":"\"Do not judge too severely those who are eloquent and preaching but do not support this in practice, for the profit of a word has often compensated for the dearth of deeds. We do not all obtain everything in equal measure. With some speech takes precedence over action, but with others the latter transcends the former.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 26, Section 155","reference":"The Ladder of Divine Ascent, Step 26, Section 155","saint":"Saint John of the Ladder (579-649 AD)","tags":["hypocrisy","judgmentalism"]},{"id":81,"topic":"On Judgmentalism","quote":"\"Slander is an offspring of hatred, a subtle yet coarse disease, a leech lurking unfelt, wasting and draining the blood of charity. It is simulation of love, the patron of a heavy and unclean heart, the ruin of chastity.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 10, Section 2","reference":"The Ladder of Divine Ascent, Step 10, Section 2","saint":"Saint John of the Ladder (579-649 AD)","tags":["gossip","hate","slander"]},{"id":82,"topic":"On Judgmentalism","quote":"\"I have heard people slandering others, and I have rebuked them. Then these doers of evil replied in self-defense that they were doing so out of love and care for the person whom they were judging. I said to them: 'Stop that kind of love, otherwise you will be condemning the prophet David as a liar who said: \u2018whoever speaks secretly against his neighbor, I have driven away from me [Psalm 100:5]\u2019. If you say you love, then pray secretly, and do not mock the man. For this is the kind of love that is acceptable to the Lord.'\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 10, Section 4","reference":"The Ladder of Divine Ascent, Step 10, Section 4","saint":"Saint John of the Ladder (579-649 AD)","tags":["gossip","prayer","slander"]},{"id":83,"topic":"On Judgmentalism","quote":"\"He who wants to overcome the spirit of slander should not ascribe the blame to the person who falls, but to the demon who suggests it.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 10, Section 5","reference":"The Ladder of Divine Ascent, Step 10, Section 5","saint":"Saint John of the Ladder (579-649 AD)","tags":["demons","gossip","overcoming the passions","slander"]},{"id":84,"topic":"On Judgmentalism","quote":"\"When you hear that your neighbor or friend has abused you behind your back or even to your face, then show love and praise him.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 22, Section 15","reference":"The Ladder of Divine Ascent, Step 22, Section 15","saint":"Saint John of the Ladder (579-649 AD)","tags":["gossip","love","praise","slander"]},{"id":85,"topic":"On Silence","quote":"\"Talkativeness is the throne of vainglory on which it loves to show itself and make a display. Talkativeness is a sign of ignorance, a door to slander, a guide to jesting, a servant of falsehood, the ruin of compunction, a creator of despondency, a precursor of sleep, the dissipation of recollection, the abolition of watchfulness, the cooling of ardor, the darkening of prayer.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 11, Section 2","reference":"The Ladder of Divine Ascent, Step 11, Section 2","saint":"Saint John of the Ladder (579-649 AD)","tags":["despondency","silence","talkativeness","vainglory"]},{"id":86,"topic":"On Repentance","quote":"\u201cThere is no unpardonable sin, save the unrepented one.\u201d -- Saint Isaac the Syrian (613-700 AD), Ascetical Homilies, Homily 2, Page 10","reference":"Ascetical Homilies, Homily 2, Page 10","saint":"Saint Isaac the Syrian (613-700 AD)","tags":["forgiveness","repentance","unpardonable"]},{"id":87,"topic":"On How to Live as a Christian","quote":"\"Let us love God at least as much as we respect our friends. For I have often seen people who had offended God and were not in the least perturbed about it. And I have seen how those same people provoked their friends in some trifling matter and then employed every artifice, every device, every sacrifice, every apology, both personally and through friends and relatives, not sparing gifts, in order to regain their former love.\" -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 1, Section 15","reference":"The Ladder of Divine Ascent, Step 1, Section 15","saint":"Saint John of the Ladder (579-649 AD)","tags":["love","sacrifice"]},{"id":88,"topic":"On Repentance","quote":"\"The first thing to do in making repentance is to go inside yourself. Earthly matters and cares and unrestrained wandering of thoughts all over the place do not allow us to go inside ourselves and to study ourselves.\" -- Saint Theophan the Recluse (1815-1894 AD), The Spiritual Life and How To Be Attuned To It, 32. Govenie: The Path of a Virtuous Life, Page 150","reference":"The Spiritual Life and How To Be Attuned To It, 32. Govenie: The Path of a Virtuous Life, Page 150","saint":"Saint Theophan the Recluse (1815-1894 AD)","tags":["knowing your sins","repentance","study ourselves","thoughts"]},{"id":89,"topic":"On Prayer","quote":"\u201cThose whose mind has learned true prayer converse with the Lord face to face, as if speaking into the ear of the Emperor. Those who make vocal prayer fall down before Him as if in the presence of the whole senate. But those who live in the world petition the Emperor amidst the clamor of all the crowds.\u201d -- Saint John of the Ladder (579-649 AD), The Ladder of Divine Ascent, Step 27, Section 21","reference":"The Ladder of Divine Ascent, Step 27, Section 21","saint":"Saint John of the Ladder (579-649 AD)","tags":["prayer"]},{"id":90,"topic":"On Heresy","quote":"\"For many sects have had birth, since their time, holding opinions opposed to their [i.e., the Apostles] words; whereof some have received all that they have said while some have cut off from the rest certain portions of their statements, and so retain them for theirselves...And like as if thou shouldest take any part from the side of an animal, even in that part thou wouldest find all the things out of which the whole is composed;--nerves and veins, bones, arteries, and blood, and a sample, as one might say, of the whole lump;--so likewise with regard to the Scriptures; in each portion of what is there stated, one may see the connection with the whole clearly appearing...and the doctrine itself had long since been brought to nought: 'for every kingdom', saith He, 'divided against itself shall not stand [Matthew 12:25]'.\" -- Saint John Chrysostom (347-407 AD), Homilies on the Gospel of St. Matthew, Homily 1, Section 8","reference":"Homilies on the Gospel of St. Matthew, Homily 1, Section 8","saint":"Saint John Chrysostom (347-407 AD)","tags":["heretics","sectarians","sects"]}];

const saints = [...new Set(QUOTES.map(q => q.saint.replace(/,\s*$/, '').trim()))].sort();
const topics = [...new Set(QUOTES.map(q => q.topic))].sort();
const allTags = [...new Set(QUOTES.flatMap(q => q.tags))].sort();

let activeTopic = null;
let activeSaint = null;
let activeTags = new Set();
let searchText = '';

function normalize(s) { return s.toLowerCase().replace(/\s+/g,' ').trim(); }

function matches(q) {
  if (activeTopic && q.topic !== activeTopic) return false;
  const qs = q.saint.replace(/,\s*$/,'').trim();
  if (activeSaint && qs !== activeSaint) return false;
  if (activeTags.size > 0) {
    for (const t of activeTags) { if (!q.tags.includes(t)) return false; }
  }
  if (searchText) {
    const hay = normalize(q.quote + ' ' + q.saint + ' ' + q.reference + ' ' + q.tags.join(' '));
    if (!hay.includes(normalize(searchText))) return false;
  }
  return true;
}

function highlight(text, term) {
  if (!term) return text;
  const escaped = term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark style="background:#F5EDD6;color:#8B6914;border-radius:2px;padding:0 2px;">$1</mark>');
}

function render() {
  const filtered = QUOTES.filter(matches);
  document.getElementById('count').textContent = filtered.length;
  const container = document.getElementById('cards');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty"><div class="cross">†</div><p>No quotes found matching your filters.</p></div>';
    return;
  }
  container.innerHTML = filtered.map(q => {
    const quoteText = searchText ? highlight(q.quote, searchText) : q.quote;
    const saintClean = q.saint.replace(/,\s*$/,'').trim();
    return `<div class="card">
      <div class="card-topic">${q.topic}</div>
      <div class="card-quote">${quoteText}</div>
      <div class="card-footer">
        <div>
          <div class="card-attribution"><span class="saint-name">${saintClean}</span></div>
          <div class="card-ref">${q.reference}</div>
        </div>
        <div class="card-tags">${q.tags.map(t =>
          `<span class="card-tag${activeTags.has(t)?' hl':''}" onclick="toggleTag('${t.replace(/'/g,"\\'")}')">
            ${t}
          </span>`
        ).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

function buildFilters() {
  const tp = document.getElementById('topic-pills');
  tp.innerHTML = topics.map(t =>
    `<span class="pill" data-topic="${t}" onclick="setTopic('${t.replace(/'/g,"\\'")}')">
      ${t.replace('On ','').replace('On','')}</span>`
  ).join('');

  const sp = document.getElementById('saint-pills');
  sp.innerHTML = saints.map(s =>
    `<span class="pill" data-saint="${s}" onclick="setSaint('${s.replace(/'/g,"\\'")}')">
      ${s.replace('Saint ','')}</span>`
  ).join('');

  const tagp = document.getElementById('tag-pills');
  tagp.innerHTML = allTags.map(t =>
    `<span class="pill" data-tag="${t}" onclick="toggleTag('${t.replace(/'/g,"\\'")}')">
      ${t}</span>`
  ).join('');
}

function setTopic(t) {
  activeTopic = (activeTopic === t) ? null : t;
  document.querySelectorAll('[data-topic]').forEach(el =>
    el.classList.toggle('active', el.dataset.topic === activeTopic));
  render();
}

function setSaint(s) {
  activeSaint = (activeSaint === s) ? null : s;
  document.querySelectorAll('[data-saint]').forEach(el =>
    el.classList.toggle('active', el.dataset.saint === activeSaint));
  render();
}

function toggleTag(t) {
  if (activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
  document.querySelectorAll('[data-tag]').forEach(el =>
    el.classList.toggle('active', activeTags.has(el.dataset.tag)));
  render();
}

document.getElementById('search').addEventListener('input', e => {
  searchText = e.target.value;
  render();
});

document.getElementById('clear-btn').addEventListener('click', () => {
  activeTopic = null; activeSaint = null; activeTags.clear(); searchText = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  render();
});

buildFilters();
render();
</script>
</body>
</html>
