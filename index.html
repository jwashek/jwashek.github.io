<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisdom of the Saints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #08080a;
  --bg-card:     #0f0f12;
  --bg-elevated: #141418;
  --bg-hover:    #1a1a20;
  --bg-glass:    rgba(20,20,24,.7);
  --border:      rgba(255,255,255,.06);
  --border-subtle: rgba(255,255,255,.04);
  --border-glow: rgba(212,165,116,.12);
  --text:        #ededef;
  --text-2:      #9d9da5;
  --text-3:      #55555e;
  --accent:      #d4a574;
  --accent-soft: rgba(212,165,116,.08);
  --accent-mid:  rgba(212,165,116,.15);
  --accent-dim:  #8b6b47;
  --tag-bg:      rgba(255,255,255,.03);
  --tag-border:  rgba(255,255,255,.06);
  --radius:      14px;
  --radius-sm:   10px;
  --shadow-sm:   0 1px 2px rgba(0,0,0,.3);
  --shadow-md:   0 4px 16px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:   0 8px 40px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  --shadow-glow: 0 0 20px rgba(212,165,116,.06);
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
}

/* Ambient background glow */
body::before {
  content: '';
  position: fixed;
  top: -40%; left: -20%;
  width: 80%; height: 80%;
  background: radial-gradient(ellipse, rgba(212,165,116,.03) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -30%; right: -10%;
  width: 60%; height: 60%;
  background: radial-gradient(ellipse, rgba(100,130,180,.02) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.14); }

/* ── Header ── */
header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(8,8,10,.85);
  backdrop-filter: blur(20px) saturate(1.2);
  z-index: 100;
  position: relative;
}

.logo { display: flex; align-items: center; gap: 14px; }
.logo-icon {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, rgba(212,165,116,.2) 0%, rgba(212,165,116,.05) 100%);
  border: 1px solid rgba(212,165,116,.2);
  border-radius: 11px;
  box-shadow: 0 2px 12px rgba(212,165,116,.1), inset 0 1px 0 rgba(255,255,255,.05);
  transition: all .3s ease;
}
.logo-icon:hover { box-shadow: 0 4px 20px rgba(212,165,116,.18), inset 0 1px 0 rgba(255,255,255,.05); }
.logo-icon svg { width: 18px; height: 18px; }
.logo-text h1 { font-size: 16px; font-weight: 600; letter-spacing: -.03em; color: var(--text); }
.logo-text p { font-size: 11px; color: var(--text-3); font-weight: 400; margin-top: 1px; letter-spacing: .01em; }

.header-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.quote-count {
  font-size: 11px; color: var(--text-3);
  font-variant-numeric: tabular-nums;
  background: var(--bg-elevated);
  padding: 5px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  letter-spacing: .01em;
}

/* ── Layout ── */
.shell { display: flex; flex: 1; overflow: hidden; min-height: 0; position: relative; z-index: 1; }

/* ── Sidebar ── */
.sidebar {
  width: 270px;
  flex-shrink: 0;
  background: rgba(10,10,12,.6);
  backdrop-filter: blur(12px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Search */
.sidebar-search { padding: 16px 14px 12px; flex-shrink: 0; }
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 13px;
  transition: all .25s ease;
  box-shadow: var(--shadow-sm);
}
.search-box:focus-within {
  border-color: rgba(212,165,116,.3);
  box-shadow: 0 0 0 3px rgba(212,165,116,.06), var(--shadow-sm);
  background: var(--bg-hover);
}
.search-box svg { color: var(--text-3); flex-shrink: 0; transition: color .2s; }
.search-box:focus-within svg { color: var(--accent); }
.search-box input {
  background: none; border: none; outline: none;
  font-family: 'Inter', sans-serif; font-size: 13px;
  color: var(--text); width: 100%;
}
.search-box input::placeholder { color: var(--text-3); }

/* Tabs */
.sidebar-tabs {
  display: flex;
  padding: 0 14px;
  gap: 2px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.tab-btn {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-3);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 11px 12px 10px;
  cursor: pointer;
  transition: all .2s;
  margin-bottom: -1px;
  white-space: nowrap;
  position: relative;
}
.tab-btn:hover { color: var(--text-2); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
.tab-btn .tab-count {
  font-size: 10px; color: var(--text-3);
  margin-left: 5px; font-variant-numeric: tabular-nums;
}

/* Panel */
.sidebar-panel { flex: 1; overflow-y: auto; padding: 8px 10px 16px; }

.filter-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 11px; border-radius: var(--radius-sm);
  cursor: pointer; transition: all .15s ease; gap: 8px;
  border: 1px solid transparent; background: none; width: 100%; text-align: left;
  font-family: 'Inter', sans-serif;
}
.filter-item:hover { background: var(--bg-hover); border-color: var(--border); }
.filter-item.active { background: var(--accent-soft); border-color: var(--border-glow); }
.filter-item .fi-label {
  font-size: 12.5px; color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1; transition: color .15s;
}
.filter-item:hover .fi-label { color: var(--text); }
.filter-item.active .fi-label { color: var(--accent); }
.filter-item .fi-count {
  font-size: 10px; color: var(--text-3);
  font-variant-numeric: tabular-nums; flex-shrink: 0;
  background: rgba(255,255,255,.04); padding: 2px 7px; border-radius: 5px;
}

/* Tags */
.tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 4px; }
.tag-chip {
  font-size: 11px; padding: 5px 11px; border-radius: 20px;
  background: var(--tag-bg); color: var(--text-3);
  cursor: pointer; border: 1px solid var(--tag-border);
  transition: all .2s ease; font-family: 'Inter', sans-serif;
}
.tag-chip:hover { background: var(--bg-hover); color: var(--text-2); border-color: rgba(255,255,255,.1); transform: translateY(-1px); }
.tag-chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--border-glow); box-shadow: var(--shadow-glow); }

.no-results-filter { font-size: 12px; color: var(--text-3); padding: 16px 10px; }

/* Sidebar footer */
.sidebar-foot {
  flex-shrink: 0; padding: 10px 14px;
  border-top: 1px solid var(--border);
}
.clear-btn {
  font-family: 'Inter', sans-serif; font-size: 11px;
  color: var(--text-3); background: none; border: none;
  cursor: pointer; padding: 5px 10px; border-radius: 7px;
  transition: all .15s;
}
.clear-btn:hover { color: var(--text-2); background: var(--bg-hover); }

/* ── Main Content ── */
.main {
  flex: 1; min-width: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  background: transparent;
}

.quote-list { flex: 1; padding: 20px 40px; max-width: 840px; margin: 0 auto; width: 100%; }

/* AI Search Bar */
.ai-search-bar {
  padding: 20px 40px 0;
  max-width: 840px;
  margin: 0 auto;
  width: 100%;
}
.ai-search-inner {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius);
  padding: 12px 16px;
  box-shadow: var(--shadow-md), var(--shadow-glow);
  transition: all .25s ease;
}
.ai-search-inner:focus-within {
  border-color: rgba(212,165,116,.3);
  box-shadow: 0 0 0 3px rgba(212,165,116,.06), var(--shadow-md), 0 0 30px rgba(212,165,116,.08);
}
.ai-icon {
  flex-shrink: 0;
  color: var(--accent);
  opacity: .7;
  transition: opacity .2s;
}
.ai-search-inner:focus-within .ai-icon { opacity: 1; }
.ai-search-inner input {
  background: none; border: none; outline: none;
  font-family: 'Inter', sans-serif; font-size: 14px;
  color: var(--text); width: 100%;
}
.ai-search-inner input::placeholder { color: var(--text-3); }
.ai-search-btn {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent-dim) 0%, var(--accent) 100%);
  border: none; border-radius: 8px;
  color: white; cursor: pointer;
  transition: all .2s ease;
  box-shadow: 0 2px 8px rgba(212,165,116,.2);
}
.ai-search-btn:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(212,165,116,.3); }
.ai-search-btn:active { transform: scale(.95); }
.ai-status {
  font-size: 11px;
  color: var(--text-3);
  padding: 6px 4px 0;
  min-height: 20px;
  transition: color .2s;
}
.ai-status.loading { color: var(--accent); }
.ai-status.ready { color: var(--text-3); }

/* Quote Cards */
.quote-card {
  padding: 28px 30px;
  margin-bottom: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: all .25s ease;
  position: relative;
  overflow: hidden;
}
.quote-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: linear-gradient(180deg, var(--accent) 0%, transparent 100%);
  opacity: 0;
  transition: opacity .25s ease;
}
.quote-card:hover {
  border-color: var(--border-glow);
  box-shadow: var(--shadow-md), var(--shadow-glow);
  transform: translateY(-1px);
}
.quote-card:hover::before { opacity: 1; }

.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.topic-pill {
  font-size: 10px; font-weight: 500;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid rgba(212,165,116,.12);
  padding: 4px 12px; border-radius: 20px;
  cursor: pointer; transition: all .2s ease;
  font-family: 'Inter', sans-serif;
  display: inline-flex; align-items: center;
}
.topic-pill:hover { background: var(--accent-mid); border-color: rgba(212,165,116,.25); box-shadow: var(--shadow-glow); }
.topic-pill.active { background: var(--accent-mid); border-color: rgba(212,165,116,.3); }

.card-quote {
  font-family: 'Newsreader', Georgia, serif;
  font-size: 16.5px;
  line-height: 1.85;
  color: var(--text);
  margin-bottom: 22px;
  font-weight: 400;
  letter-spacing: .005em;
}

.card-attribution {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.card-meta { display: flex; flex-direction: column; gap: 4px; }
.saint-name {
  font-size: 13px; font-weight: 500; color: var(--accent);
  display: flex; align-items: center; gap: 6px;
}
.saint-ref {
  font-size: 11px; color: var(--text-3); font-family: 'Inter', sans-serif;
}
.ref-link {
  color: var(--text-3); text-decoration: none;
  margin-left: 6px; transition: all .2s;
  font-size: 11px; padding: 2px 6px; border-radius: 4px;
}
.ref-link:hover { color: var(--accent); background: var(--accent-soft); }

.card-tags { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; max-width: 50%; }
.card-tag {
  font-size: 10px; padding: 3px 9px; border-radius: 12px;
  background: var(--tag-bg); color: var(--text-3);
  cursor: pointer; border: 1px solid var(--tag-border);
  transition: all .15s ease; font-family: 'Inter', sans-serif;
}
.card-tag:hover { color: var(--text-2); border-color: rgba(255,255,255,.1); background: var(--bg-hover); }
.card-tag.active { color: var(--accent); border-color: var(--border-glow); background: var(--accent-soft); }

/* Copy button */
.copy-btn {
  display: flex; align-items: center; gap: 5px;
  font-family: 'Inter', sans-serif; font-size: 11px;
  color: var(--text-3); background: var(--tag-bg);
  border: 1px solid var(--tag-border); border-radius: 7px;
  padding: 5px 10px; cursor: pointer;
  transition: all .2s ease;
  white-space: nowrap;
}
.copy-btn:hover { color: var(--text-2); background: var(--bg-hover); border-color: rgba(255,255,255,.1); }
.copy-btn.copied {
  color: #6ecf8a; border-color: rgba(110,207,138,.2);
  background: rgba(110,207,138,.06);
}
.copy-btn .copy-label { pointer-events: none; }

/* ── States ── */
.state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 80px 24px; color: var(--text-3); gap: 12px;
}
.state p { font-size: 13px; }
.spinner {
  width: 22px; height: 22px;
  border: 2px solid rgba(255,255,255,.06);
  border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s cubic-bezier(.5,.1,.5,.9) infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

mark { background: rgba(212,165,116,.18); color: inherit; border-radius: 3px; padding: 0 2px; }

/* ── Responsive ── */
@media (max-width: 768px) {
  html, body { overflow: auto; }
  .shell { flex-direction: column; overflow: visible; }
  .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
  .main { overflow: visible; }
  .quote-list { padding: 16px 16px; }
  .quote-card { padding: 22px 20px; }
  .card-tags { max-width: 100%; justify-content: flex-start; }
  .card-attribution { flex-direction: column; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="2" x2="12" y2="22"/>
        <line x1="7" y1="5" x2="17" y2="5"/>
        <line x1="4" y1="9" x2="20" y2="9"/>
        <line x1="7" y1="16" x2="17" y2="18"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>Wisdom of the Saints</h1>
      <p>Holy Fathers of the Eastern Orthodox Church</p>
    </div>
  </div>
  <div class="header-right">
    <span class="quote-count" id="quote-count"></span>
  </div>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-search">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
          <line x1="11" y1="11" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" id="search" placeholder="Search quotes, saints, tags…" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div class="sidebar-tabs">
      <button class="tab-btn active" data-tab="topic" onclick="switchTab('topic')">
        Topics <span class="tab-count" id="tab-count-topic"></span>
      </button>
      <button class="tab-btn" data-tab="saint" onclick="switchTab('saint')">
        Saints <span class="tab-count" id="tab-count-saint"></span>
      </button>
      <button class="tab-btn" data-tab="tag" onclick="switchTab('tag')">
        Tags <span class="tab-count" id="tab-count-tag"></span>
      </button>
    </div>

    <div class="sidebar-panel" id="sidebar-panel"></div>

    <div class="sidebar-foot">
      <button class="clear-btn" id="clear-btn">✕ Clear filters</button>
    </div>
  </aside>

  <main class="main">
    <div class="ai-search-bar" id="ai-search-bar">
      <div class="ai-search-inner">
        <div class="ai-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <input type="text" id="ai-input" placeholder="Ask a question… e.g. 'What did the Saints say about raising children?'" autocomplete="off" spellcheck="false">
        <button class="ai-search-btn" id="ai-search-btn" onclick="runAISearch()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
      <div class="ai-status" id="ai-status"></div>
    </div>

    <div class="quote-list" id="quote-list"></div>
  </main>
</div>

<script>
const SAMPLE_QUOTES = [{"id":0,"topic":"On Repentance","quote":"\u201cThe only safe thing is repentance. Any spiritual structure must be built on it. We ceaselessly ask God for repentance and for nothing else. We shouldn\u2019t ask for light, miracles, prophesies and other gifts, but repentance. Repentance brings humility, and humility will bring grace of God, because it is a law: grace of God always comes to the humble.\u201d","reference":"On Spiritual Life, Section 13","saint":"Saint Paisios (1924-1994 AD)","tags":["humility","repentance","salvation"],"url":""},{"id":1,"topic":"On Suffering and Trials","quote":"\"What are you telling me, the apostle seems to say [Romans 8:18], about wounds, torturers, punishments, hunger, deprivation, prisons, and chains? All these, and more besides are not even worth comparing to the glory, the reward, and the crowns prepared for us. For these trials end with this present life, but the heavenly joy is without end.\"","reference":"Homilies on Romans, Homily 8","saint":"Saint John Chrysostom (347-407 AD)","tags":["afflictions","crowns","suffering","trials"],"url":""},{"id":2,"topic":"On Parenting","quote":"\"Generally the parents are to blame for the bad behavior of the children. And their behavior is not improved by reprimands, disciplining, or strictness. If the parents do not pursue a life of holiness and if they don\u2019t engage in spiritual struggle, they make great mistakes and transmit the faults they have within them.\"","reference":"Wounded By Love, On the Upbringing of Children, Page 196","saint":"Saint Porphyrios (1906-1991 AD)","tags":["children","discipline","holiness","parenting","spiritual warfare"],"url":""},{"id":3,"topic":"On Prayer","quote":"\u201cThose whose mind has learned true prayer converse with the Lord face to face, as if speaking into the ear of the Emperor. Those who make vocal prayer fall down before Him as if in the presence of the whole senate. But those who live in the world petition the Emperor amidst the clamor of all the crowds.\u201d","reference":"The Ladder of Divine Ascent, Step 27, Section 21","saint":"Saint John of the Ladder (579-649 AD)","tags":["prayer"],"url":""},{"id":4,"topic":"On Despair and Despondency","quote":"\"It is bad to despair, because someone who despairs becomes embittered and loses his willingness and strength. Someone who has hope, on the contrary, advances forward.\"","reference":"Wounded By Love, On Divine Eros, Page 98","saint":"Saint Porphyrios (1906-1991 AD)","tags":["despair","hope"],"url":""},{"id":5,"topic":"On Silence","quote":"\"Talkativeness is the throne of vainglory on which it loves to show itself and make a display. Talkativeness is a sign of ignorance, a door to slander, a guide to jesting, a servant of falsehood, the ruin of compunction, a creator of despondency, a precursor of sleep, the dissipation of recollection, the abolition of watchfulness, the cooling of ardor, the darkening of prayer.\"","reference":"The Ladder of Divine Ascent, Step 11, Section 2","saint":"Saint John of the Ladder (579-649 AD)","tags":["despondency","silence","talkativeness","vainglory"],"url":""},{"id":6,"topic":"On Judgmentalism","quote":"\"Do not regard the feelings of a person who speaks to you about his neighbor disparagingly, but rather say to him: 'Stop, brother! I fall into graver sins every day, so how can I criticize him?'\"","reference":"The Ladder of Divine Ascent, Step 10, Section 7","saint":"Saint John of the Ladder (579-649 AD)","tags":["gossip","judgmentalism","slander"],"url":""},{"id":7,"topic":"On Faith and Works","quote":"\"True faith cannot be without works; one who truly believes will unfailingly have works as well.\"","reference":"Little Russian Philokalia (Vol. I), 4 - Faith, Paragraph 3","saint":"Saint Seraphim of Sarov (1754-1833 AD)","tags":["faith alone","works"],"url":""},{"id":8,"topic":"On Love and Mercy","quote":"\"Love sinners, but hate their works; and do not despise them for their faults, lest you be tempted by the same.\"","reference":"Ascetical Homilies, Homily 5, Page 51","saint":"Saint Isaac the Syrian (613-700 AD)","tags":["love","loving others","sin","sinners","temptations"],"url":""},{"id":9,"topic":"On Confession","quote":"\"God forgives everything with confession. We mustn\u2019t turn back and enmesh ourselves in despair. We need to be humble servants before God and have a sense of gratitude for the forgiveness of our sins.\"","reference":"Wounded by Love, God Forgives Everything with Confession, Page 176","saint":"Saint Porphyrios (1906-1991 AD)","tags":["confession","despair","forgiveness","gratitude"],"url":""}];

const QUOTES_URL = './quotes.json';

// ── State ─────────────────────────────────────────────────────────────────────
let Q = [], activeTopic = null, activeSaint = null, activeTags = new Set();
let search = '', activeTab = 'topic';

const norm = s => s.toLowerCase().replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
const esc = s => s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

function visibleQuotes() {
  return Q.filter(q => {
    if (activeTopic && q.topic !== activeTopic) return false;
    if (activeSaint && q.saint.replace(/,\s*$/,'').trim() !== activeSaint) return false;
    for (const t of activeTags) if (!q.tags.includes(t)) return false;
    if (search) {
      const h = norm(q.quote+' '+q.saint+' '+q.reference+' '+q.tags.join(' '));
      if (!h.includes(norm(search))) return false;
    }
    return true;
  });
}

function searchMatched() {
  if (!search) return Q;
  return Q.filter(q => {
    const h = norm(q.quote+' '+q.saint+' '+q.reference+' '+q.tags.join(' '));
    return h.includes(norm(search));
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function hl(s) {
  if (!search) return s;
  const e = search.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return s.replace(new RegExp(`(${e})`,'gi'),'<mark>$1</mark>');
}

function renderQuotes() {
  const filtered = visibleQuotes();
  document.getElementById('quote-count').textContent = filtered.length + ' of ' + Q.length + ' quotes';

  const el = document.getElementById('quote-list');
  if (!filtered.length) {
    el.innerHTML = '<div class="state"><p>No quotes match your search.</p></div>';
    return;
  }
  el.innerHTML = filtered.map(q => {
    const sc = q.saint.replace(/,\s*$/,'').trim();
    const fullText = q.quote + ' -- ' + sc + ', ' + q.reference;
    return `<div class="quote-card" data-quote="${fullText.replace(/"/g,'&quot;')}">
      <div class="card-header">
        <span class="topic-pill${activeTopic===q.topic?' active':''}" onclick="setTopic('${esc(q.topic)}')">${q.topic || 'Uncategorized'}</span>
        <button class="copy-btn" onclick="copyQuote(this)" aria-label="Copy quote">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span class="copy-label">Copy</span>
        </button>
      </div>
      <div class="card-quote">${hl(q.quote)} -- ${sc}, ${q.reference}</div>
      <div class="card-attribution">
        <div class="card-meta">
          <span class="saint-name">${sc}</span>
          <span class="saint-ref">${q.reference}${q.url ? ` <a href="${q.url}" target="_blank" rel="noopener" class="ref-link">\u2197</a>` : ''}</span>
        </div>
        <div class="card-tags">${q.tags.map(t =>
          `<span class="card-tag${activeTags.has(t)?' active':''}" onclick="toggleTag('${esc(t)}')">${t}</span>`
        ).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

function renderPanel() {
  const matched = searchMatched();

  const topicCounts = {};
  matched.forEach(q => { topicCounts[q.topic] = (topicCounts[q.topic]||0)+1; });
  const topics = Object.keys(topicCounts).sort();

  const saintCounts = {};
  matched.forEach(q => {
    const s = q.saint.replace(/,\s*$/,'').trim();
    saintCounts[s] = (saintCounts[s]||0)+1;
  });
  const saints = Object.keys(saintCounts).sort();

  const tagSet = new Set(matched.flatMap(q => q.tags));
  const tags = [...tagSet].sort();

  document.getElementById('tab-count-topic').textContent = topics.length;
  document.getElementById('tab-count-saint').textContent = saints.length;
  document.getElementById('tab-count-tag').textContent = tags.length;

  const panel = document.getElementById('sidebar-panel');

  if (activeTab === 'topic') {
    if (!topics.length) { panel.innerHTML = '<div class="no-results-filter">No matching topics</div>'; return; }
    panel.innerHTML = topics.map(t =>
      `<button class="filter-item${activeTopic===t?' active':''}" onclick="setTopic('${esc(t)}')">
        <span class="fi-label">${t}</span>
        <span class="fi-count">${topicCounts[t]}</span>
      </button>`
    ).join('');

  } else if (activeTab === 'saint') {
    if (!saints.length) { panel.innerHTML = '<div class="no-results-filter">No matching saints</div>'; return; }
    panel.innerHTML = saints.map(s =>
      `<button class="filter-item${activeSaint===s?' active':''}" onclick="setSaint('${esc(s)}')">
        <span class="fi-label">${s.replace('Saint ','St. ')}</span>
        <span class="fi-count">${saintCounts[s]}</span>
      </button>`
    ).join('');

  } else {
    if (!tags.length) { panel.innerHTML = '<div class="no-results-filter">No matching tags</div>'; return; }
    panel.innerHTML = `<div class="tag-cloud">${tags.map(t =>
      `<span class="tag-chip${activeTags.has(t)?' active':''}" onclick="toggleTag('${esc(t)}')">${t}</span>`
    ).join('')}</div>`;
  }
}

function render() { renderQuotes(); renderPanel(); }

// ── Actions ───────────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderPanel();
}
function setTopic(t) { activeTopic = activeTopic===t ? null : t; render(); }
function setSaint(s) { activeSaint = activeSaint===s ? null : s; render(); }
function toggleTag(t) { activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); render(); }

function copyQuote(btn) {
  const card = btn.closest('.quote-card');
  const text = card.getAttribute('data-quote');
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.querySelector('.copy-label').textContent = 'Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.querySelector('.copy-label').textContent = 'Copy';
    }, 2000);
  });
}

document.getElementById('search').addEventListener('input', e => { search = e.target.value; render(); });
document.getElementById('clear-btn').addEventListener('click', () => {
  activeTopic = null; activeSaint = null; activeTags.clear(); search = '';
  document.getElementById('search').value = '';
  render();
});

// ── Load from static JSON ─────────────────────────────────────────────────────
async function loadQuotes() {
  try {
    const r = await fetch(QUOTES_URL);
    if (!r.ok) throw new Error('Failed to load quotes');
    return await r.json();
  } catch(e) {
    console.error('Load error:', e);
    return SAMPLE_QUOTES;
  }
}

(async () => {
  document.getElementById('quote-list').innerHTML = '<div class="state"><div class="spinner"></div><p>Loading quotes\u2026</p></div>';
  Q = await loadQuotes();
  render();
})();

// ── AI Semantic Search ────────────────────────────────────────────────────────
const EMBEDDINGS_URL = './embeddings.json';
let embeddings = null;
let aiPipeline = null;
let aiLoading = false;
let aiMode = false; // when true, show AI results instead of normal filters

const statusEl = () => document.getElementById('ai-status');

// Load embeddings in background
async function loadEmbeddings() {
  try {
    const r = await fetch(EMBEDDINGS_URL);
    if (!r.ok) throw new Error('No embeddings file');
    embeddings = await r.json();
    console.log(`Loaded ${embeddings.length} embeddings`);
  } catch(e) {
    console.warn('Embeddings not available:', e.message);
  }
}

// Load AI model in background
async function loadAIModel() {
  if (aiPipeline || aiLoading) return;
  aiLoading = true;
  statusEl().textContent = 'Loading AI model (first time only)…';
  statusEl().className = 'ai-status loading';

  try {
    const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
    aiPipeline = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
    statusEl().textContent = 'AI ready — ask a question about the Saints';
    statusEl().className = 'ai-status ready';
  } catch(e) {
    statusEl().textContent = 'AI unavailable — using keyword search as fallback';
    statusEl().className = 'ai-status';
    console.error('Model load failed:', e);
  }
  aiLoading = false;
}

// Cosine similarity
function cosineSim(a, b) {
  let dot = 0, normA = 0, normB = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    normA += a[i] * a[i];
    normB += b[i] * b[i];
  }
  return dot / (Math.sqrt(normA) * Math.sqrt(normB));
}

// Run semantic search
async function runAISearch() {
  const query = document.getElementById('ai-input').value.trim();
  if (!query) return;

  if (!aiPipeline) {
    await loadAIModel();
    if (!aiPipeline) { /* fallback to keyword */ search = query; render(); return; }
  }
  if (!embeddings || embeddings.length !== Q.length) { search = query; render(); return; }

  statusEl().textContent = 'Searching…';
  statusEl().className = 'ai-status loading';

  const output = await aiPipeline(query, { pooling: 'mean', normalize: true });
  const queryEmb = Array.from(output.data);

  // Score each quote
  const scored = Q.map((q, i) => ({ ...q, score: cosineSim(queryEmb, embeddings[i]) }));
  scored.sort((a, b) => b.score - a.score);

  // Show top 10 results
  const top = scored.slice(0, 10);
  statusEl().textContent = `Found ${top.length} relevant quotes for: "${query}"`;
  statusEl().className = 'ai-status ready';

  // Render AI results directly
  const el = document.getElementById('quote-list');
  el.innerHTML = top.map(q => {
    const sc = q.saint.replace(/,\s*$/,'').trim();
    const fullText = q.quote + ' -- ' + sc + ', ' + q.reference;
    const pct = Math.round(q.score * 100);
    return `<div class="quote-card" data-quote="${fullText.replace(/"/g,'&quot;')}">
      <div class="card-header">
        <span class="topic-pill" onclick="setTopic('${esc(q.topic)}')">${q.topic || 'Uncategorized'}</span>
        <button class="copy-btn" onclick="copyQuote(this)" aria-label="Copy quote">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span class="copy-label">Copy</span>
        </button>
      </div>
      <div class="card-quote">${q.quote} -- ${sc}, ${q.reference}</div>
      <div class="card-attribution">
        <div class="card-meta">
          <span class="saint-name">${sc}</span>
          <span class="saint-ref">${q.reference}${q.url ? ` <a href="${q.url}" target="_blank" rel="noopener" class="ref-link">↗</a>` : ''}</span>
        </div>
        <div class="card-tags">${q.tags.map(t =>
          `<span class="card-tag" onclick="toggleTag('${esc(t)}')">${t}</span>`
        ).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

// Enter key triggers AI search
document.getElementById('ai-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') runAISearch();
});

// Start loading embeddings + model in background after page loads
setTimeout(() => { loadEmbeddings(); loadAIModel(); }, 1000);
</script>
